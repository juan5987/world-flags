<div class="ocean-modal-backdrop">
  <div class="ocean-modal-card" role="dialog" aria-labelledby="signup-title" aria-modal="true">
    <header class="ocean-modal-header">
      <h1 id="signup-title">Inscription</h1>
      <button type="button" class="ocean-modal-close" aria-label="Fermer" routerLink="/">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </header>

    <svg
      class="ocean-modal-wave"
      viewBox="0 0 600 24"
      preserveAspectRatio="none"
      aria-hidden="true"
      focusable="false"
    >
      <path
        d="M0 12 C 75 24, 150 0, 225 12 C 300 24, 375 0, 450 12 C 525 24, 570 12, 600 12 L 600 24 L 0 24 Z"
        fill="var(--primary-color)"
        opacity="0.22"
      />
    </svg>

    <div class="card-body">
      <form class="signup-form">
        <div class="ocean-field">
          <label for="name">Pseudo</label>
          <div class="ocean-field-control">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="ton pseudo"
              autocomplete="username"
            />
          </div>
        </div>

        <div class="ocean-field">
          <label for="email">Email</label>
          <div class="ocean-field-control">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="m3 7 9 6 9-6" />
            </svg>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="toi@exemple.com"
              autocomplete="email"
            />
          </div>
        </div>

        <div class="ocean-field">
          <label for="confirm-email">Confirmation de l'email</label>
          <div class="ocean-field-control">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="m3 7 9 6 9-6" />
            </svg>
            <input
              type="email"
              id="confirm-email"
              name="confirm-email"
              placeholder="toi@exemple.com"
              autocomplete="email"
            />
          </div>
        </div>

        <div class="ocean-field">
          <label for="password">Mot de passe</label>
          <div class="ocean-field-control">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="5" y="11" width="14" height="9" rx="2" />
              <path d="M8 11V7a4 4 0 0 1 8 0v4" />
            </svg>
            <input
              [type]="showPassword() ? 'text' : 'password'"
              id="password"
              name="password"
              placeholder="********"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="ocean-toggle-visibility"
              (click)="togglePasswordVisibility()"
              [attr.aria-pressed]="showPassword()"
              aria-label="Afficher ou masquer le mot de passe"
            >
              @if (showPassword()) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-5 0-9-4-10-7a12.5 12.5 0 0 1 3.16-4.5" />
                  <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c5 0 9 4 10 7a12.86 12.86 0 0 1-1.67 2.68" />
                  <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              } @else {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              }
            </button>
          </div>
        </div>

        <div class="ocean-field">
          <label for="confirm-password">Confirmation du mot de passe</label>
          <div class="ocean-field-control">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="5" y="11" width="14" height="9" rx="2" />
              <path d="M8 11V7a4 4 0 0 1 8 0v4" />
            </svg>
            <input
              [type]="showConfirmPassword() ? 'text' : 'password'"
              id="confirm-password"
              name="confirm-password"
              placeholder="********"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="ocean-toggle-visibility"
              (click)="toggleConfirmPasswordVisibility()"
              [attr.aria-pressed]="showConfirmPassword()"
              aria-label="Afficher ou masquer la confirmation du mot de passe"
            >
              @if (showConfirmPassword()) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-5 0-9-4-10-7a12.5 12.5 0 0 1 3.16-4.5" />
                  <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c5 0 9 4 10 7a12.86 12.86 0 0 1-1.67 2.68" />
                  <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              } @else {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              }
            </button>
          </div>
        </div>

        <div class="form-actions">
          <app-button
            [buttonText]="'Annuler'"
            [buttonStyle]="'form-cancel'"
            [routerLink]="'../login'"
          ></app-button>
          <app-button
            class="signup-primary-cta"
            [buttonText]="'M\'inscrire'"
            [buttonStyle]="'form-validate'"
            [routerLink]="'../login'"
          ></app-button>
        </div>
      </form>
    </div>
  </div>
</div>
