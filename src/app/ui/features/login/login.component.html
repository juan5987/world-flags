<div class="ocean-modal-backdrop">
  <div class="ocean-modal-card" role="dialog" aria-labelledby="login-title" aria-modal="true">
    <header class="ocean-modal-header">
      <h1 id="login-title">Connexion</h1>
      <button type="button" class="ocean-modal-close" aria-label="Fermer" routerLink="/">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </header>

    <svg
      class="ocean-modal-wave"
      viewBox="0 0 600 24"
      preserveAspectRatio="none"
      aria-hidden="true"
      focusable="false"
    >
      <path
        d="M0 12 C 75 24, 150 0, 225 12 C 300 24, 375 0, 450 12 C 525 24, 570 12, 600 12 L 600 24 L 0 24 Z"
        fill="var(--primary-color)"
        opacity="0.22"
      />
    </svg>

    <div class="card-body">
      <button type="button" class="google-cta" (click)="signInWithGoogle()">
        <svg class="google-logo" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <path
            fill="#FFC107"
            d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"
          />
          <path
            fill="#FF3D00"
            d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"
          />
          <path
            fill="#4CAF50"
            d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"
          />
          <path
            fill="#1976D2"
            d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"
          />
        </svg>
        <span>Continuer avec Google</span>
      </button>

      <div class="divider-text"><span>ou avec un e-mail</span></div>

      <form class="login-form">
        <div class="ocean-field">
          <label for="email">Email</label>
          <div class="ocean-field-control">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="m3 7 9 6 9-6" />
            </svg>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="toi@exemple.com"
              autocomplete="email"
            />
          </div>
        </div>

        <div class="ocean-field">
          <label for="password">Mot de passe</label>
          <div class="ocean-field-control">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="5" y="11" width="14" height="9" rx="2" />
              <path d="M8 11V7a4 4 0 0 1 8 0v4" />
            </svg>
            <input
              [type]="showPassword() ? 'text' : 'password'"
              id="password"
              name="password"
              placeholder="********"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="ocean-toggle-visibility"
              (click)="togglePasswordVisibility()"
              [attr.aria-pressed]="showPassword()"
              aria-label="Afficher ou masquer le mot de passe"
            >
              @if (showPassword()) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-5 0-9-4-10-7a12.5 12.5 0 0 1 3.16-4.5" />
                  <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c5 0 9 4 10 7a12.86 12.86 0 0 1-1.67 2.68" />
                  <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              } @else {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              }
            </button>
          </div>
        </div>

        <a class="forgot-password" routerLink="/forgot-password">Mot de passe oublié ?</a>

        <div class="form-actions">
          <app-button
            [buttonText]="'Annuler'"
            [buttonStyle]="'form-cancel'"
            [routerLink]="'../'"
          ></app-button>
          <app-button
            class="login-primary-cta"
            [buttonText]="'Connexion'"
            [buttonStyle]="'form-validate'"
            [routerLink]="'../login'"
          ></app-button>
        </div>
      </form>

      <p class="signup-text">
        Pas encore inscrit ? <a routerLink="/sign-up">Créer un compte</a>
      </p>
    </div>
  </div>
</div>
